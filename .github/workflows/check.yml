# Analyzes the Dart code and runs its tests on every push to a branch other than main
# (main is checked by building its release). Nothing is built or released here.
name: Check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - run: flutter pub get

      # Errors fail the check; warnings and hints are listed but don't.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
